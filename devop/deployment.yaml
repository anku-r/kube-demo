apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubedemo-deploy
spec:
  replicas: 5
  selector:
    matchLabels:
      project: kube-demo
  minReadySeconds: 10 
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels: 
        project: kube-demo
    spec:
      containers:
      - name: kubedemo
        imagePullPolicy: Always
        image: ankur2411/kube-demo:2.0.2
        env:
        - name: SECURITY_USERS
          valueFrom:
            secretKeyRef:
              name: kubedemo-security
              key: SECURITY_USERS
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health/liveness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/readiness
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: kubedemo-lb
spec:
  type: LoadBalancer
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    project: kube-demo